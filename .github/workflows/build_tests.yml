name: Run Build Tests
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'version.py'
      - 'test/**'
      - 'examples/**'
      - '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'MANIFEST.in'
      - 'readme.md'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Build Tools
        run: |
          python -m pip install build wheel
      - name: Build Distribution Packages (bdist_wheel)
        run: |
          python setup.py bdist_wheel
      - name: Install package
        run: |
          pip install .
      - name: Import the installed package
        # `pip install .` succeeding says nothing about the wheel importing.
        # `ovos_utils` was imported by __init__.py and declared nowhere, and
        # this job stayed green through it for as long as it existed, because
        # it never imported what it installed.
        #
        # The `cd` is load-bearing: from the checkout root the source tree
        # satisfies `import ovos_i2c_detection` whether or not the package is
        # installed, so the check would pass on an uninstalled package.
        run: |
          cd "$RUNNER_TEMP"
          python -c "import ovos_i2c_detection; print(ovos_i2c_detection.__file__)"
